<head>

<body class="is-preload">

    <!-- Header -->
    <header id="header">
        <a href="https://www.andersondiagnostics.com/contact/" class="title">Contact us </a>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="panelss.html" class="active">Back</a></li>
            </ul>
        </nav>

    <!-- Wrapper -->
    <div id="wrapper">

        <!-- Main -->
        <section id="main" class="wrapper">
            <div class="inner">
                <div class="content">
                    <h1 class="major">Prenatal Genetic Panel</h1>
                    <p class="template-hub-subtitle">Select the prenatal AF report for fetal whole exome analysis and download the demonstration template.</p>
                    <div class="image logo" style="position: absolute; top: 0; right: 0;">
                        <img src="images/pic1.png" alt="Logo" />
                    </div>
                    <div class="condition-list">
                        <div class="condition-card is-open">
                            <button type="button" class="condition-card__header">
                                <span class="condition-card__icon"><i class="fas fa-baby"></i></span>
                                <span class="condition-card__meta">
                                    <span class="condition-card__name">AF Report</span>
                                    <span class="condition-card__count">2 Templates Available</span>
                                </span>
                                <i class="fas fa-chevron-down condition-card__chevron"></i>
                            </button>
                            <div class="condition-card__body">
                                <div class="condition-btn-grid">
                                    <a href="Germline Templates/Prenatal/AF/Fetus_of_XX_Whole_Exome_Report_Demo.pdf" target="_blank" class="condition-btn--with">@Fetus_of_XX_Whole_Exome_Report_Demo (PDF)</a>

                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
