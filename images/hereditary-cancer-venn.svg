<?xml version="1.0" encoding="UTF-8"?>
<!-- Hereditary cancer gene panel: the overlapping-circles diagram of the
     cancers a germline panel covers. Vector redraw of images/hereditary.png,
     which is only 245px wide and upscaled badly in the homepage card. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" width="600" height="470" role="img" aria-label="Hereditary cancers covered: breast, ovarian, gastric, colorectal, pancreatic, melanoma, prostate and endometrial">
  <rect width="600" height="470" fill="#ffffff"/>

  <!-- Semi-transparent fills rather than mix-blend-mode: alpha compositing
       darkens the overlaps identically in every browser. -->
  <g fill-opacity="0.55">
    <circle cx="300"   cy="163"   r="92" fill="#c2185b"/>
    <circle cx="350.9" cy="184.1" r="92" fill="#1f3f8f"/>
    <circle cx="372"   cy="235"   r="92" fill="#1a2f6b"/>
    <circle cx="350.9" cy="285.9" r="92" fill="#7b3f9d"/>
    <circle cx="300"   cy="307"   r="92" fill="#0e8b93"/>
    <circle cx="249.1" cy="285.9" r="92" fill="#17a08c"/>
    <circle cx="228"   cy="235"   r="92" fill="#3aa35a"/>
    <circle cx="249.1" cy="184.1" r="92" fill="#8bc34a"/>
  </g>

  <g font-family="Lato, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="0.6">
    <text x="300" y="44"  text-anchor="middle" fill="#c2185b">BREAST</text>
    <text x="455" y="107" text-anchor="start"  fill="#1f3f8f">OVARIAN</text>
    <text x="503" y="241" text-anchor="start"  fill="#1a2f6b">GASTRIC</text>
    <text x="455" y="377" text-anchor="start"  fill="#7b3f9d">COLORECTAL</text>
    <text x="300" y="443" text-anchor="middle" fill="#0e8b93">PANCREATIC</text>
    <text x="145" y="377" text-anchor="end"    fill="#17a08c">MELANOMA</text>
    <text x="97"  y="241" text-anchor="end"    fill="#3aa35a">PROSTATE</text>
    <text x="145" y="107" text-anchor="end"    fill="#6a9e2f">ENDOMETRIAL</text>
  </g>
</svg>
